/* ===== GLOBAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#0d0d0d;
  color:#fff;
}

.container{
  padding:60px 10%;
}

.sub-title{

  margin-bottom:30px;
}

.work-v{
  margin:50px 0 20px;
  font-size:22px;
  color:#ff004f;
}

/* ===== GRID ===== */
.work-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

/* ===== LONG FORM 1920x1080 ===== */
.long-work{
  grid-column:span 2;
}

.video-wrapper{
  width:100%;
  max-width:1920px;
  margin:auto;
  aspect-ratio:16/9;   /* 1920x1080 ratio */
  background:#000;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.long-video{
  width:100%;
  height:100%;
  object-fit:contain; /* keeps true resolution */
}

/* ===== SHORT FORM ===== */
.work-video{
  width:100%;
  border-radius:12px;
}

/* ===== GRAPHICS ===== */
.work-image{
  width:100%;
  border-radius:12px;
}

/* ===== CONTACT ===== */
.social-icons a{
  margin-right:15px;
  font-size:22px;
  color:#fff;
  transition:0.3s;
}

.social-icons a:hover{
  color:#ff004f;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 28px;
  background:#ff004f;
  border-radius:6px;
  color:#fff;
  text-decoration:none;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .long-work{
    grid-column:span 1;
  }

  .sub-title{

}

</style>
